# Render Blueprint: New > Blueprint > pick this repo. Values marked sync:false are asked for in the dashboard.
services:
  - type: web
    name: bookr-analyst
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter            # an always-on instance, so the daily Friction Finder schedule can run
    numInstances: 1          # sync state and the daily scheduler live in-process; do not scale out
    healthCheckPath: /api/health
    envVars:
      - key: SOURCE_DATABASE_URL   # Bookkr source database (read-only login)
        sync: false
      - key: ANALYST_DATABASE_URL  # Bookr Analyst's own Neon database; same value as your local .env
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Login for the whole site (browser prompt). Leave both empty to run without a login.
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: INTERNAL_USER_IDS
        sync: false
      - key: INTERNAL_EMAIL_DOMAINS
        sync: false
      - key: SYNC_SINCE
        sync: false
      - key: FRICTION_DAILY_AT
        sync: false
      - key: TZ_OFFSET_MINUTES
        value: "330"
      - key: FRICTION_LLM_PROVIDER
        value: api           # the Claude Code CLI login is not available in the container
      - key: FRICTION_USE_LLM
        value: auto
      # Quality > Operations service checks (optional; a service reads NOT SET UP until its value is set)
      - key: BACKEND_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TRAVEL_GATEWAY_BASE_URL
        sync: false
      - key: TRAVEL_GATEWAY_JWT_SECRET
        sync: false
      - key: TRAVEL_GATEWAY_JWT_ISSUER
        sync: false
      - key: PAYMENTS_SERVICE_URL
        sync: false
      - key: SERP_API_KEY
        sync: false
      - key: SEARCH_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
